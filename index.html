<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula Lotto - Dream Big</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Orbitron', 'sans-serif'],
            },
            colors: {
              lotto: {
                dark: '#050b14',
                card: 'rgba(255, 255, 255, 0.03)',
                primary: '#6366f1',
                secondary: '#a855f7',
                accent: '#f43f5e',
                gold: '#fbbf24',
              }
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'shine': 'shine 1.5s infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              shine: {
                '0%': { left: '-100%' },
                '100%': { left: '100%' },
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #050b14;
        color: #e2e8f0;
        overflow-x: hidden;
      }
      
      /* Nebula Background */
      .nebula-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #050b14 100%);
      }
      
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.4;
        z-index: -1;
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      }
      
      .glass-input {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
      }
      .glass-input:focus {
        border-color: #818cf8;
        background: rgba(0, 0, 0, 0.4);
      }

      .gold-gradient {
        background: linear-gradient(135deg, #fcd34d 0%, #fbbf24 50%, #d97706 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
      }
      
      .text-glow {
        text-shadow: 0 0 10px rgba(255,255,255,0.5);
      }

      .ball-gradient {
        background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0) 20%),
                    linear-gradient(135deg, #475569 0%, #1e293b 100%);
        box-shadow: inset -2px -2px 6px rgba(0,0,0,0.5), 2px 2px 5px rgba(0,0,0,0.3);
      }
      
      .ball-selected {
        background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 20%),
                    linear-gradient(135deg, #fcd34d 0%, #f59e0b 100%);
        box-shadow: 0 0 15px rgba(245, 158, 11, 0.6), inset -2px -2px 6px rgba(0,0,0,0.3);
        transform: scale(1.1);
      }
      
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.02);
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(255,255,255,0.2);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
</head>
  <body>
    <div class="nebula-bg">
        <!-- Floating Ambient Blobs -->
        <div class="blob bg-purple-600 w-96 h-96 top-0 left-0 -translate-x-1/2 -translate-y-1/2 animate-pulse-slow"></div>
        <div class="blob bg-blue-600 w-[30rem] h-[30rem] bottom-0 right-0 translate-x-1/3 translate-y-1/3 animate-pulse-slow" style="animation-delay: 2s"></div>
        <div class="blob bg-pink-600 w-64 h-64 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 animate-pulse-slow opacity-20" style="animation-delay: 1s"></div>
    </div>
    <div id="root"></div>
  </body>
</html>
